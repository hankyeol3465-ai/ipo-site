return'<div class="ip-dg g'+k+'"><h4>'+KN[k]+' · '+xs.length+'건</h4>'+xs.map(function(e){var c=e.c,r='';
if(k<2){var x=nth(e.a,e.b,day);r=x?'<em class="ip-nth'+(x[0]===x[1]?' last':'')+'">'+x[0]+'일차'+(x[0]===x[1]?' · 마감':'')+'</em>':''}
else if(k===3)r=e.q||'';else r=c.ws||'';
return'<div class="ip-it" data-id="'+c.i+'"><div class="l1"><b>'+esc(c.n)+'</b>'+tags(c)+(r?'<span class="r">'+r+'</span>':'')+'</div><div class="u">'+[uws(c),px(c)].filter(Boolean).join(' · ')+'</div></div>'}).join('')+'</div>'}).join('')}

var calMonth=T.slice(0,7),calDay=T;
function month(){var y=+calMonth.slice(0,4),mo=+calMonth.slice(5,7),first=new Date(y,mo-1,1),t=iso(new Date(y,mo-1,1-first.getDay())),cells='';
for(var k=0;k<42;k++){var inM=t.slice(0,7)===calMonth,w=dOf(t).getDay();if(k===35&&!inM)break;
var ks={};(DE[t]||[]).forEach(function(e){ks[e.k]=1});
var dots=[0,1,3,4].filter(function(x){return ks[x]}).map(function(x){return'<i class="k'+x+'"></i>'}).join('');
cells+='<button type="button" class="ip-cd'+(inM?'':' out')+(t===T?' today':'')+(t===calDay?' sel':'')+(w===0?' sun':w===6?' sat':'')+'" data-day="'+t+'" aria-label="'+mdw(t)+'"><span class="dn">'+dOf(t).getDate()+'</span><span class="ip-dots">'+dots+'</span></button>';
t=add(t,1)}
var sel=DE[calDay]||[];
return'<div class="ip-hd"><h2>공모 달력</h2><div class="ip-nav"><button type="button" class="ip-x" data-mon="-1" aria-label="이전 달">‹</button><b>'+y+'.'+pad(mo)+'</b>'+
'<button type="button" class="ip-x" data-mon="1" aria-label="다음 달">›</button><button type="button" class="ip-lnk" data-mon="0">오늘</button></div></div>'+
'<div class="ip-pb"><div class="ip-lg">'+[0,1,3,4].map(function(x){return'<span><i class="k'+x+'"></i>'+KN[x]+'</span>'}).join('')+'</div>'+
'<div class="ip-cg">'+WDN.map(function(x,i){return'<span class="ip-cw'+(i===0?' sun':i===6?' sat':'')+'">'+x+'</span>'}).join('')+cells+'</div>'+
'<h3 class="ip-day">'+mdw(calDay)+' <span>'+sel.length+'건</span></h3>'+dayList(sel,calDay)+'</div>'}

/* 딜별 공모 일정: 앞으로 70일 안에 일정이 남은 건. 진행 중 = 오늘 수요예측·청약 기간이거나 상장일 */
function dealTable(){var rows=[];
C.forEach(function(c){if(!c.o||c.w)return;
var nxt=[c.ds,c.de,c.ss,c.se,c.ld].filter(function(v){return v&&v>=T}).sort()[0];
if(nxt&&nxt<=add(T,70))rows.push({c:c,nxt:nxt})});
function live(r){var c=r.c;return(c.ds&&c.ds<=T&&(c.de||c.ds)>=T)||(c.ss&&c.ss<=T&&(c.se||c.ss)>=T)||c.ld===T}
function lk(r){return(r.c.ld||'9999-99-99')+'|'+r.nxt+'|'+r.c.n}
var now=rows.filter(live).sort(function(a,b){return a.nxt<b.nxt?-1:a.nxt>b.nxt?1:(a.c.n<b.c.n?-1:1)});
var next=rows.filter(function(r){return!live(r)}).sort(function(a,b){return lk(a)<lk(b)?-1:1});
function cr(a,b){if(!a)return'미정';if(!b||b===a)return md(a);return md(a)+'~'+(a.slice(0,7)===b.slice(0,7)?+b.slice(8):md(b))}
function stt(a,b){return!a?'na':a<=T&&(b||a)>=T?'on':(b||a)<T?'done':''}
function cell(k,a,b,q){return'<span class="ip-cc c'+k+' '+stt(a,b)+'"><b>'+cr(a,b)+'</b>'+(q?'<small>'+q+'</small>':'')+'</span>'}
function row(r,i){var c=r.c;return'<div class="ip-xr'+(i>=5?' rest':'')+'" data-id="'+c.i+'"><span class="nm">'+esc(c.n)+'</span>'+cell(0,c.ds,c.de)+cell(1,c.ss,c.se)+cell(3,c.ld,c.ld,c.lq)+'</div>'}
var head='<div class="ip-bh"><span>회사</span><span>수요예측</span><span>청약</span><span>상장</span></div>',h='';
if(now.length)h+='<div class="ip-grp"><div class="ip-sec">진행 중<span class="ip-cnt">'+now.length+'</span></div>'+head+now.map(function(r){return row(r,0)}).join('')+'</div>';
if(next.length)h+='<div class="ip-grp ip-mg"><div class="ip-sec">다가오는 일정<span class="ip-cnt">'+next.length+'</span></div>'+head+next.map(row).join('')+(next.length>5?MORE:'')+'</div>';
return panel('딜별 공모 일정',null,h||'<div class="ip-emp">확인된 공모 일정이 없습니다.</div>')}

/* 승인 후 상장 대기: 진행 = 신고서를 낸 뒤의 단계, 승인 효력(6개월) 만료 45일 이내면 승인일을 붉게 */
function waitPanel(){var W=D.wait||[],DOT={filed:['신고','filed'],fixed:['확정','fixed'],up:['예정','up'],done:['상장','up'],wd:['철회','off']};
var rows=W.map(function(x,i){var c=C[x.i],left=days(T,x.exp),o=c.o?DOT[st(c)]:left<0?['만료','off']:['대기','off'];
return'<div class="w'+(i>=5?' rest':'')+'" data-id="'+c.i+'"><span class="nm">'+esc(c.n)+'</span><span class="uw">'+uws(c,3)+'</span><span class="dd'+(left<=45?' warn':'')+'" title="효력 만료 '+x.exp+'">'+x.d.slice(2).replace(/-/g,'.')+'</span><span class="ip-sd d-'+o[1]+'"><i></i>'+o[0]+'</span></div>'}).join('');
return panel('승인 후 상장 대기',W.length,W.length?'<div class="h"><span>회사</span><span>주관사</span><span style="text-align:right">승인일</span><span>진행</span></div>'+rows+(W.length>5?MORE:''):'<div class="ip-emp">승인 후 상장을 기다리는 회사가 없습니다.</div>','ip-t4 ip-mg')}
function wdPanel(){var from=add(T,-30),ws=C.filter(function(c){return c.o&&c.w&&c.wd&&c.wd>=from&&c.wd<=T}).sort(function(a,b){return a.wd<b.wd?1:a.wd>b.wd?-1:(a.n<b.n?-1:1)});
var rows=ws.map(function(c,i){return'<div class="w'+(i>=5?' rest':'')+'" data-id="'+c.i+'"><span class="nm">'+esc(c.n)+'</span><span class="uw">'+uws(c,3)+'</span><span class="dd">'+md(c.wd)+'</span><span class="ip-sd">'+esc(c.ws||'')+'</span></div>'}).join('');
return panel('최근 1개월 공모 철회',ws.length,ws.length?'<div class="h"><span>회사</span><span>주관사</span><span style="text-align:right">철회일</span><span>철회 단계</span></div>'+rows+(ws.length>5?MORE:''):'<div class="ip-emp">최근 1개월 안에 공모를 철회한 회사가 없습니다.</div>','ip-t4 ip-mg')}

/* 목록 */
var F='all',Q='',LIM=30;
function match(c,q){if(!q)return true;return/^[ㄱ-ㅎ]+$/.test(q)?c.qc.indexOf(q)>=0:c.q.indexOf(q)>=0}
function grp(c){var s=st(c);return s==='done'?'done':s==='wd'?'wd':'live'}
function rvRow(c,i,ap){var el,cls='',bar;
if(ap){el=c.pa?days(c.pa,T):0;bar='<span class="ip-bar '+(el>150?'warn':'ok')+'"><i style="width:'+Math.min(100,Math.round(el/183*100))+'%"></i></span>'}
else{el=c.pf?days(c.pf,T):0;if(D.med&&el>D.med)cls=' over';bar='<span class="ip-bar'+cls+'"><i style="width:'+(D.med?Math.min(100,Math.round(el/D.med*100)):0)+'%"></i></span>'}
var tg=(c.mk&&c.mk!=='KQ'?' <span class="ip-tg">'+c.mk+'</span>':'')+(c.lt?' <span class="ip-tg sp">'+esc(c.lt)+'</span>':'');
return'<div class="ip-rv'+(i>=5?' rest':'')+'" data-id="'+c.i+'"><span class="nm">'+esc(c.n)+tg+'</span><span class="el'+cls+'">'+((ap?c.pa:c.pf)?el+'일':'–')+'</span>'+bar+'<span class="uw">'+uws(c,3)+'</span></div>'}
function card(c){var s=st(c),r2,r3='',r4=[],am=c.amt?'<span class="am"><small>공모액</small> '+num(c.amt)+'억</span>':'';
if(s==='done'||s==='up')r2='상장 '+c.ld+(c.lq?' '+c.lq:'');
else if(s==='wd')r2=c.wd?'철회 '+c.wd:'철회일 미확인';
else r2=c.ds?'수요예측 '+md2(c.ds)+(c.de&&c.de!==c.ds?'~'+md2(c.de):''):c.fd?'신고 '+c.fd:'';
r2=[r2,uws(c)].filter(Boolean).join(' · ');
if(c.fp){r3=(c.lo&&c.pos!=='고정가'?band(c)+' → ':'')+'<b>'+num(c.fp)+'</b>'+pill(c);
if(c.ic)r4.push('수요예측 '+num(c.ic)+':1');if(c.sc)r4.push('일반청약 '+(c.sc<10?c.sc:num(c.sc))+':1');if(c.amt)r4.push('공모액 '+num(c.amt)+'억');am=''}
else if(c.lo)r3='<small>밴드</small> '+band(c);
return'<div class="ip-dc" data-id="'+c.i+'"><div class="r1"><b>'+esc(c.n)+'</b>'+tags(c)+'<span class="ip-st s-'+s+'"><i></i>'+STL[s]+'</span></div>'+
(r2?'<div class="r2">'+r2+'</div>':'')+(r3||am?'<div class="r3">'+r3+am+'</div>':'')+(r4.length?'<div class="r4">'+r4.join(' · ')+'</div>':'')+'</div>'}
function listBody(){var q=Q.trim().toLowerCase(),h='';
if(F==='all'||F==='rv'){
var rv=C.filter(function(c){return c.rv&&match(c,q)}).sort(function(a,b){return(a.pf||'')<(b.pf||'')?1:-1});
var ap=C.filter(function(c){return c.ap&&match(c,q)}).sort(function(a,b){return(a.pa||'')<(b.pa||'')?1:-1});
var open=!!q||F==='rv';
if(rv.length)h+=panel('예심 심사 중',rv.length,'<div class="ip-nt">청구 후 경과일'+(D.med?' · 막대는 최근 1년 심사 기간 중앙값 '+D.med+'일 대비':'')+'</div>'+rv.map(function(c,i){return rvRow(c,i,false)}).join('')+(rv.length>5&&!open?MORE:''),'ip-mg'+(open?' open':''));
if(ap.length)h+=panel('예심 승인 · 공모 전',ap.length,'<div class="ip-nt">승인 후 경과일 · 막대는 승인 효력 6개월 대비</div>'+ap.map(function(c){return rvRow(c,0,true)}).join(''))}
if(F!=='rv'){
var ds=C.filter(function(c){return c.o&&match(c,q)&&(F==='all'||grp(c)===F)}).sort(function(a,b){var x=a.sk||'',y=b.sk||'';return x<y?1:x>y?-1:(a.n<b.n?-1:1)});
if(ds.length){h+='<div class="ip-dl">'+ds.slice(0,LIM).map(card).join('')+'</div>';
if(ds.length>LIM)h+='<button type="button" class="ip-more" data-lim>더 보기 ('+LIM+' / '+ds.length+'건)</button>'}}
return h||'<div class="ip-emp">조건에 맞는 회사가 없습니다.</div>'}

/* 회사 상세(카드·표의 줄을 누르면 뜸) */
function pct(v){return v==null?'':'<span class="'+(v>0?'pos':v<0?'neg':'')+'">'+(v>0?'+':'')+v.toFixed(1)+'%</span>'}
function eok(v){return v==null?'':(Math.abs(v)<100?v.toFixed(1):num(v))+'억원'}
function rg(a,b){return a?a+(b&&b!==a?' ~ '+b.slice(5):''):''}
function sheetHtml(c){var s=c.o?st(c):null,S=[];
function sec(t,rows){rows=rows.filter(function(r){return r[1]});if(rows.length)S.push((t?'<div class="hd">'+t+'</div>':'')+rows.map(function(r){return'<dt>'+r[0]+'</dt><dd>'+r[1]+'</dd>'}).join(''))}
sec('',[['주관사',esc(c.uwf.join(', '))],['업종',esc(c.ind)],['주요 제품',esc(c.prod)],['기업 구분',esc(c.cls)]]);
sec('일정',[['예심 청구',c.pf?c.pf+(c.rv?' · '+days(c.pf,T)+'일 경과':''):''],
['예심 승인',c.pa?c.pa+(c.rd?' · 청구 후 '+c.rd+'일':''):''],['신고서 제출',c.fd],['수요예측',rg(c.ds,c.de)],['청약',rg(c.ss,c.se)],
['납입',c.pd],[c.lq?'상장 '+c.lq:'상장',c.ld?c.ld+(c.lq==='예상'?' · 납입일 + 5영업일':''):''],['공모 철회',c.wd?c.wd+(c.ws?' · '+c.ws:''):'']]);
sec('가격 · 수요',[['희망 밴드',c.lo&&c.pos!=='고정가'?band(c)+'원':''],['확정 공모가',c.fp?num(c.fp)+'원 '+pill(c):''],
['기관 경쟁률',c.ic?num(c.ic)+':1':''],['의무보유 확약',esc(c.lk)],['청약 경쟁률',c.sc?(c.sc<10?c.sc:num(c.sc))+':1':''],['공모액',c.amt?num(c.amt)+'억원':'']]);
sec('상장 후 (공모가 대비)',[['첫날 시가',pct(c.ro)],['첫날 종가',pct(c.rc)],['최근 종가',pct(c.rl)]]);
sec('청구 시점 실적',[['매출액',eok(c.rev)],['순이익',eok(c.ni)],['자기자본',eok(c.eqt)]]);
var lk=(c.url?'<a href="'+c.url+'" target="_blank" rel="noopener">DART 공시</a>':'')+(c.u38?'<a href="'+c.u38+'" target="_blank" rel="noopener">38커뮤니케이션</a>':'');
return'<div class="ip-shb"><h3>'+esc(c.n)+tags(c)+(s?'<span class="ip-st s-'+s+'"><i></i>'+STL[s]+'</span>':'')+'<button type="button" class="ip-cl" data-close aria-label="닫기">×</button></h3>'+
'<dl class="ip-kv">'+S.join('')+'</dl>'+(lk?'<div class="ip-lk">'+lk+'</div>':'')+'</div>'}

var elCal=document.getElementById('ipo-cal'),elList=document.getElementById('ipo-list'),elLb=document.getElementById('ipo-lb'),sh=document.getElementById('ipo-sh'),inp=document.getElementById('ipo-q');
function drawM(){document.getElementById('ipo-m').innerHTML=month()}
function drawL(){elLb.innerHTML=listBody()}
function go(id,keep){var cal=id!=='list';elCal.hidden=!cal;elList.hidden=cal;
[].forEach.call(root.querySelectorAll('[data-seg]'),function(b){b.classList.toggle('on',b.getAttribute('data-seg')===(cal?'cal':'list'))});
if(!keep){try{localStorage.setItem('ipo_seg',cal?'cal':'list')}catch(e){}}}
function closeSh(){sh.hidden=true;sh.innerHTML=''}
elCal.innerHTML=brief()+'<div class="ip-pn" id="ipo-m"></div>'+dealTable()+'<div class="ip-two">'+waitPanel()+wdPanel()+'</div>'+
'<p class="ip-ft">KIND·38커뮤니케이션·DART 공개 자료를 자동으로 모은 값입니다. 상장일은 KIND·38커뮤니케이션에 올라온 날짜만 싣고, 아직 없으면 미정으로 둡니다. '+esc(D.gen)+' 갱신</p>';
drawM();drawL();
root.addEventListener('click',function(e){var t=e.target,b;
if(t===sh||t.closest('[data-close]')){closeSh();return}
if((b=t.closest('[data-seg]'))){go(b.getAttribute('data-seg'));return}
if((b=t.closest('[data-mon]'))){var n=+b.getAttribute('data-mon');
if(!n){calMonth=T.slice(0,7);calDay=T}else{var d=new Date(+calMonth.slice(0,4),+calMonth.slice(5,7)-1+n,1);calMonth=iso(d).slice(0,7)}
drawM();return}
if((b=t.closest('[data-day]'))){calDay=b.getAttribute('data-day');calMonth=calDay.slice(0,7);drawM();return}
if((b=t.closest('[data-f]'))){F=b.getAttribute('data-f');LIM=30;
[].forEach.call(root.querySelectorAll('[data-f]'),function(x){x.classList.toggle('on',x===b)});drawL();return}
if(t.closest('[data-lim]')){LIM+=30;drawL();return}
if((b=t.closest('.ip-more'))){b.parentNode.classList.toggle('open');return}
if(t.closest('a'))return;
if((b=t.closest('[data-id]'))){sh.innerHTML=sheetHtml(C[+b.getAttribute('data-id')]);sh.hidden=false}});
inp.addEventListener('input',function(){Q=inp.value;LIM=30;drawL()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!sh.hidden)closeSh()});
try{if(localStorage.getItem('ipo_seg')==='list')go('list',true)}catch(e){}
})();
</script></body></html>
